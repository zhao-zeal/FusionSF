# @package _global_

defaults:
  - override /datamodule: tscontext_3modal_fixed_v1.yaml
  - override /pl_module: fusionsf_3modal.yaml
  - override /trainer: default.yaml
  - override /hydra: pipeline_v1_fixed.yaml
  - _self_

experiment_version: pipeline_v1_fixed
experiment_id: ${now:%Y%m%d_%H%M%S}_fusionsf3m_sites${datamodule.dataset.num_sites}_seq${datamodule.dataset.seq_len}_pred${datamodule.dataset.pred_len}_seed${seed}
task_name: ${experiment_id}
seed: 42

trainer:
  max_epochs: 100
  deterministic: true
  strategy: null

pl_module:
  evaluation_mode: full_modalities
  monitor: val/mae
  model:
    modality_mode: all
    guide_channels: 15
    masking_policy: fixed_ratio
    output_activation: identity
    ctx_masking_ratio: 0.85
    ts_masking_ratio: 0.15
    vq_in_ts: false
    vq_in_ctx: false
    vq_in_guide: false

callbacks:
  model_checkpoint:
    monitor: val/mae
  early_stopping:
    monitor: val/mae
