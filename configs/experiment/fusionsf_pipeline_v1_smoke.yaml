# @package _global_

defaults:
  - fusionsf_pipeline_v1_fixed
  - _self_

trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  limit_train_batches: 2
  limit_val_batches: 2
  limit_test_batches: 2

datamodule:
  dataset:
    num_sites: 2
  batch_size: 2
  test_batch_size: 4
  num_workers: 0
  pin_memory: false

pl_module:
  model:
    dim: 16
    depth: 1
    heads: 1
    dim_head: 16
    mlp_ratio: 1
    decoder_dim: 16
    decoder_depth: 1
    decoder_heads: 1
    decoder_dim_head: 16
    dropout: 0
